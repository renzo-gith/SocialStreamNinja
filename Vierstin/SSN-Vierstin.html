<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay</title>
    <script src="https://socialstream.ninja/libs/colours.js" type="text/javascript"></script>
    <!-- Links to Social Stream Ninja resources -->
    <link rel="canonical" href="https://socialstream.ninja/">
    <meta name="generator" content="Social Stream Ninja - https://github.com/steveseguin/social_stream">
<style>
/* -- TEMA STREAM ELEMENTS DIADAPTASI UNTUK SOCIAL STREAM NINJA -- */
/* Ganti seluruh isi <style> Anda dengan kode ini */

/* 1. Impor Font dan Pengaturan Dasar */
/* =================================== */
@import url('https://fonts.googleapis.com/css2?family=Radley:wght@600;700;900&display=swap');

body, html {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Radley', serif;
    overflow: hidden; /* Mencegah scrollbar yang tidak diinginkan */
}

/* 2. Wadah Utama Pesan */
/* =================================== */
/* ID ini harus sama dengan yang ada di HTML Anda */
#chat-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 400px;
    display: flex;
    flex-direction: column;
    gap: 28px; /* Sedikit mengurangi jarak agar lebih pas */
    overflow: visible;
}

/* 3. Animasi Pesan */
/* =================================== */
.chat-message {
    padding: 4px 4px;
    background-color: #ffffff;
    border-radius: 14px;
    animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    position: relative;
    display: inline-block;
    align-self: flex-start;
}

@keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3) translateX(-80px) translateY(50px) rotate(20deg); }
    50% { opacity: 1; transform: scale(1.05); }
    70% { opacity: 1; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}

.fade-out {
    animation: fadeOut 0.6s ease-in forwards;
}
@keyframes fadeOut {
    to { opacity: 0; transform: translateY(-50px); }
}

/* Animasi ornamen */
@keyframes sway {
    from { transform: rotate(-6deg); }
    to { transform: rotate(6deg); }
}
@keyframes sway-tilt-neg-90 {
    from { transform: rotate(-96deg); }
    to { transform: rotate(-84deg); }
}
@keyframes sway-tilt-neg90 {
    from { transform: rotate(84deg); }
    to { transform: rotate(96deg); }
}


/* 4. Gaya Pesan Biasa & Lencana */
/* =================================== */
.message {
    font-weight: 700;
    background: #ffffff;
    color: #FF7070;
    font-size: 14px;
    padding: 8px 32px;
    border-radius: 10px;
    display: inline-block;
    min-width: 100px;
    box-sizing: border-box;
    overflow-wrap: break-word;
    position: relative;
}

.badge {
    position: absolute;
    font-weight: 700;
    color: #FF7070;
    padding: 2px 10px;
    border: 0.5px solid #FF7070;
    border-radius: 6px;
    font-size: 12px;
    top: -26px;
    left: 8px;
    z-index: 4;
    background-color: #ffffff;
    white-space: nowrap;
    overflow: visible;
    text-overflow: ellipsis;
}

/* Perbaikan final untuk SEMUA jenis emoji dan stiker */
.message img {
    /* Atur ukuran yang diinginkan */
    width: 28px !important;
    height: 28px !important;

    /* Jaga agar tetap sejajar dengan teks */
    vertical-align: middle !important;
    
    /* Perbaikan visual minor */
    display: inline-block !important;
    margin: -4px 2px 0 2px !important;
}

/* Stiker / gambar konten */
.message img.content-img,
.message video.content-img {
    display: block !important;
    width: auto !important;
    height: auto !important;
    max-width: 80px !important;
    max-height: 80px !important;
    margin: 6px 0 0 0 !important;
    border-radius: 8px;
}

/* Nama panjang dipotong dengan "…" (ornamen badge tetap terlihat) */
.badge .name {
    display: inline-block;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
}

/* 5. Gaya Berdasarkan Peran (Owner, Moderator, dll.) */
/* ================================================= */
/* Ornamen dasar */
.message::before, .message::after, .badge::before, .badge::after, .ornament-extra-1, .ornament-extra-2 {
    content: '';
    position: absolute;
    background-size: contain;
    background-repeat: no-repeat;
    transform-origin: bottom center;
}

/* Owner */
.chat-message.owner {
    background-image: linear-gradient(to bottom, #FCC8C4, #E46870);
    padding: 4px; 
    border-radius: 14px;
    margin-bottom: 10px; 
}
.chat-message.owner .message {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/ornament-bg.svg'), 
    linear-gradient(to bottom, #FCC8C4, #E46870);
    background-repeat: no-repeat, no-repeat;
    background-position: center calc(50% - 12px), center;
    background-size: clamp(56px, 50%, 80vw) auto, cover;
    border: 1px solid #ffffff;
    color: #ffffff;
}
.chat-message.owner .badge {
    background-image: linear-gradient(to bottom, #FCC8C4, #E46870);
    border: 0.5px solid #ffffff;
    color: #ffffff;
}
.chat-message.owner .badge::before {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/tangkai%2012x10.svg');
  width: 16px; height: 13px; top: -6px; left: -1px; z-index: 5;
  transform: rotate(-35deg);
}
.chat-message.owner .badge::after {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/star%20putih.svg');
    width: 12px; height: 12px; top: 50%; right: -6px;transform: translateY(-50%); z-index: 5;
}

/* Moderator */
.chat-message.moderator {
  background-image: linear-gradient(to bottom, #E46870, #5E0B15);
  padding: 1px;
  border: 4px solid #4B1F1B;
  border-radius: 15px;
  margin-bottom: 10px; 
}
.chat-message.moderator .message {
  background-color: #4B1F1B;
  color: #F6C4C3;
}
.chat-message.moderator .badge {
  background-color: #4B1F1B;
  border: 0.5px solid #E46870;
  color: #F6C4C3;
}
.chat-message.moderator .message::before {
  background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/lumeran%20pink%2050x24.svg');
  width: 50px; height: 24px; top: -8px; left: -7px; z-index: 2;
}
.chat-message.moderator .badge::before {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/tangkai%2012x10.svg');
  width: 16px; height: 13px; top: -6px; left: -1px; z-index: 5;
  transform: rotate(-35deg);
}
.chat-message.moderator .badge::after {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/star%20merah.svg');
    width: 12px; height: 12px; top: 50%; right: -6px;transform: translateY(-50%); z-index: 5;
}

/* Member */
.chat-message.member {
  background-image: linear-gradient(to right, #E46870, #5E0B15);
  padding: 4px; 
  border-radius: 14px;
  margin-bottom: 10px; 
}
.chat-message.member .message {
  background-image: linear-gradient(to right, #E46870, #5E0B15);
  border: 1px solid #F6C4C3;
  color: #F6C4C3;
}
.chat-message.member .badge {
  background-image: linear-gradient(to right, #E46870, #5E0B15);
  border: 0.5px solid #F6C4C3;
  color: #F6C4C3;
}
.chat-message.member .message::before {
  background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/lumeran%20cerah%2050x24.svg');
  width: 50px; height: 24px; top: -8px; left: -7px; z-index: 2;
}
.chat-message.member .badge::before {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/tangkai%2012x10.svg');
  width: 16px; height: 13px; top: -6px; left: -1px; z-index: 5;
  transform: rotate(-35deg);
}
.chat-message.member .badge::after {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/star%20pink.svg');
    width: 12px; height: 12px; top: 50%; right: -6px;transform: translateY(-50%); z-index: 5;
}

/* Regular */
.chat-message.regular {
  background-color: #FFEBD3;
  padding: 4px;
  border-radius: 14px;
  margin-bottom: 10px; 
}
.chat-message.regular .message {
  background-color: #FFEBD3;
  border: 1px solid #4B1F1B;
  color: #4B1F1B;
}
.chat-message.regular .badge {
  background-color: #FFEBD3;
  border: 0.5px solid #4B1F1B;
  color: #4B1F1B;
}
.chat-message.regular .message::before {
  background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/e2ee1873f92ea90b04dc3cce99e00f821e3d2d04/Vierstin/Asset/lumeran%20coklat%2050x24.svg');
  width: 50px; height: 24px; top: -8px; left: -7px; z-index: 2;
}
.chat-message.regular .badge::before {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/e2ee1873f92ea90b04dc3cce99e00f821e3d2d04/Vierstin/Asset/tangkai%2012x10.svg');
  width: 16px; height: 13px; top: -6px; left: -1px; z-index: 5;
  transform: rotate(-35deg);
}
.chat-message.regular .badge::after {
    background-image: url('https://raw.githubusercontent.com/renzo-gith/SocialStreamNinja/378d5db63cdc88f9195accfa5465dbb051444cb7/Vierstin/Asset/star%20coklat.svg');
    width: 12px; height: 12px; top: 50%; right: -6px;transform: translateY(-50%); z-index: 5;
}

</style>
</head>
<body>
<div id="chat-container">
    <div id="message-list-wrapper">
		<div id="spacer" style="height: 2200px; width: 100%;"></div>
    </div>
</div>
<script>
    // ===================================================================
    // == BAGIAN 1: PENGATURAN
    // ===================================================================

    // EDIT NAMA PENGGUNA STREAMER DI SINI (huruf besar/kecil dan "@" diabaikan)
    const STREAMER_USERNAME = ["El Pirstinn", "VierstinRovve"];

    const chatContainer = document.getElementById('chat-container');
    const urlParams = new URLSearchParams(window.location.search);
    const MAX_MESSAGES = Math.max(1, parseInt(urlParams.get("limit"), 10) || 8);
    const AUTO_HIDE = Math.max(0, parseInt(urlParams.get("autohide"), 10) || 0); // &autohide=30 = pesan hilang setelah 30 detik

    const lower = s => String(s == null ? "" : s).toLowerCase();
    const normName = s => lower(s).trim().replace(/^@+/, "");
    const STREAMERS = STREAMER_USERNAME.map(normName);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    function safeUrl(u) {
        u = String(u || "").trim();
        return /^(https?:)?\/\//i.test(u) || /^data:image\//i.test(u) ? u : "";
    }
    function contentMediaHTML(url) {
        url = safeUrl(url);
        if (!url) return "";
        if (/\.(mp4|webm)(\?|#|$)/i.test(url)) {
            return `<video class="content-img" src="${esc(url)}" autoplay muted loop playsinline></video>`;
        }
        return `<img class="content-img" src="${esc(url)}" alt="" onerror="this.remove()">`;
    }

    // === QUEUE SYSTEM (Sistem Antrian Pesan) ===
    const messageQueue = [];
    let isProcessing = false;

    function processQueue() {
        if (isProcessing || messageQueue.length === 0) return;
        isProcessing = true;
        addChatMessage(messageQueue.shift());
        setTimeout(() => {
            isProcessing = false;
            processQueue();
        }, 600); // Jeda 600ms antar pesan agar tidak spam
    }

    function enqueueMessage(item) {
        messageQueue.push(item);
        if (!isProcessing) processQueue();
    }

    // === FUNGSI ANIMASI ===
    function animateChatShift(newEl) {
        const messages = Array.from(chatContainer.children);
        const firstRects = messages.map(el => el.getBoundingClientRect());

        chatContainer.appendChild(newEl);

        const lastRects = messages.map(el => el.getBoundingClientRect());

        messages.forEach((el, i) => {
            const deltaY = firstRects[i]?.top - lastRects[i]?.top;
            if (deltaY) {
                requestAnimationFrame(() => {
                    el.style.transform = `translateY(${deltaY}px)`;
                    el.style.transition = 'transform 0s';
                });
            }
        });

        requestAnimationFrame(() => {
            messages.forEach(el => {
                el.style.transform = '';
                el.style.transition = 'transform 0.4s ease-out';
            });
        });
    }

    // === HAPUS PESAN ===
    function removeEl(el) {
        if (!el || el.classList.contains('fade-out')) return;
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 600);
    }
    // Pesan yang masih tampil (tidak termasuk spacer dan pesan yang sedang menghilang)
    function activeMessages() {
        return Array.from(chatContainer.querySelectorAll('.chat-message:not(.fade-out)'));
    }
    function enforceLimit() {
        const list = activeMessages();
        for (let i = 0; i < list.length - MAX_MESSAGES; i++) removeEl(list[i]);
    }

    // Pesan dihapus moderator
    function handleDelete(del) {
        if (!del) return;
        activeMessages().forEach(el => {
            let hit = false;
            if (del.id != null && el.dataset.mid === String(del.id)) hit = true;
            else if (del.meta && del.meta.messageId && el.dataset.nativeId === String(del.meta.messageId)) hit = true;
            else if (del.id == null && !(del.meta && del.meta.messageId)) {
                if (del.userid && el.dataset.userid === lower(del.userid)) hit = true;
                else if (del.chatname && el.dataset.name === lower(del.chatname)) hit = true;
            }
            if (hit) removeEl(el);
        });
    }
    // Pengguna di-ban: hapus semua pesannya
    function removeUser(data) {
        const uid = lower(data.userid), name = lower(data.chatname);
        activeMessages().forEach(el => {
            if ((uid && el.dataset.userid === uid) || (name && el.dataset.name === name)) removeEl(el);
        });
    }

    // === FUNGSI PEMBUAT TAMPILAN PESAN (HTML Builder) ===
    function addChatMessage(item) {
        const chatEl = document.createElement('div');
        chatEl.className = `chat-message ${item.role}`;
        chatEl.dataset.name = lower(item.username);
        if (item.userid) chatEl.dataset.userid = lower(item.userid);
        if (item.id != null) chatEl.dataset.mid = String(item.id);
        if (item.nativeId) chatEl.dataset.nativeId = String(item.nativeId);

        chatEl.innerHTML = `
            <div class="badge"><span class="name">${esc(item.username)}</span></div>
            <div class="message">
                ${item.messageHTML}${contentMediaHTML(item.contentimg)}
                <span class="ornament-extra-1"></span>
                <span class="ornament-extra-2"></span>
            </div>
        `;

        animateChatShift(chatEl);
        enforceLimit();

        if (AUTO_HIDE > 0) {
            setTimeout(() => removeEl(chatEl), AUTO_HIDE * 1000);
        }
    }

    // ===================================================================
    // == BAGIAN 2: "JEMBATAN" PENGHUBUNG SSN KE SISTEM ANDA
    // ===================================================================

    function addMessageToOverlay(data) {
        if (!data || typeof data !== 'object') return;

        if (data.delete) { handleDelete(data.delete); return; }
        if (data.event === 'user_banned') { removeUser(data); return; }

        // Hanya pesan chat biasa: semua event (join, like, follow, gift, share, dll.) diabaikan
        if (data.event) return;

        const username = data.chatname || data.username || '';
        // Pesan teks dari SSN berupa HTML (emote = <img>). Kalau &textonly, escape.
        const messageHTML = data.textonly ? esc(data.chatmessage || '') : (data.chatmessage || '');

        // Abaikan jika tidak ada isi pesan maupun stiker
        if (!String(messageHTML).trim() && !data.contentimg) return;

        // Tentukan peran
        let roleClass = 'regular';

        if (STREAMERS.includes(normName(data.chatname)) || (data.username && STREAMERS.includes(normName(data.username)))) {
            roleClass = 'owner';
        } else {
            const badgeSrcs = (data.chatbadges || []).map(badge => {
                if (typeof badge === 'string') return badge.toLowerCase();
                if (badge && typeof badge === 'object' && typeof badge.src === 'string') return badge.src.toLowerCase();
                return '';
            }).filter(Boolean);

            if (badgeSrcs.some(src => src.includes('broadcaster') || src.includes('owner'))) {
                roleClass = 'owner';
            } else if (data.mod === true || badgeSrcs.some(src => src.includes('moderator') || src.includes('moderater'))) {
                roleClass = 'moderator';
            } else if (
                data.membership === "MEMBERSHIP" ||
                badgeSrcs.some(src =>
                    src.includes('gifter') ||
                    src.includes('subscriber') ||
                    src.includes('member') ||
                    (src.includes('fans_badge') && !src.includes('grey'))
                )
            ) {
                roleClass = 'member';
            }
        }

        const meta = data.meta || {};
        enqueueMessage({
            username, messageHTML, role: roleClass, contentimg: data.contentimg,
            userid: data.userid, id: data.id, nativeId: meta.messageId
        });
    }

    // ===================================================================
    // == BAGIAN 3: KODE SSN UNTUK MENERIMA DATA
    // == Tanpa ?session= di URL, widget tidak tersambung ke mana pun.
    // ===================================================================
    const roomID = (urlParams.get("session") || "").trim();
    var password = "false";
    var featuredMode = false;

    if (roomID) {
        var iframe = document.createElement("iframe");
        if (featuredMode) {
            iframe.src = `https://vdo.socialstream.ninja/?ln&password=${password}&salt=vdo.ninja&label=overlay&exclude=${encodeURIComponent(roomID)}&scene&novideo&noaudio&cleanoutput&room=${encodeURIComponent(roomID)}`;
        } else {
            iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=" + password + "&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=" + encodeURIComponent(roomID);
        }
        iframe.style.cssText = "width:0;height:0;border:0;position:absolute;top:-10px;left:-10px;";
        document.body.appendChild(iframe);
        window.addEventListener("message", function(e) {
            if (e.source != iframe.contentWindow) return;
            if (e.data && e.data.dataReceived && e.data.dataReceived.overlayNinja) {
                addMessageToOverlay(e.data.dataReceived.overlayNinja);
            }
        });
    }

    var conCon = 1;
    var socketserver = false;
    var serverURL = urlParams.has("localserver") ? "ws://127.0.0.1:3000" : "wss://io.socialstream.ninja";

    function setupSocket() {
        socketserver.onclose = function() {
            setTimeout(function() {
                conCon += 1;
                socketserver = new WebSocket(serverURL);
                setupSocket();
            }, 100 * conCon);
        };
        socketserver.onopen = function() {
            conCon = 1;
            socketserver.send(JSON.stringify({ "join": roomID, "out": 3, "in": 4 }));
        };
        socketserver.addEventListener('message', function(event) {
            if (event.data) {
                try {
                    var data = JSON.parse(event.data);
                    if (data) addMessageToOverlay(data);
                } catch (error) {
                    console.error("Error processing WebSocket message:", error);
                }
            }
        });
    }

    if (roomID && (urlParams.has("server") || urlParams.has("server2"))) {
        serverURL = urlParams.get("server") || urlParams.get("server2") || serverURL;
        socketserver = new WebSocket(serverURL);
        setupSocket();
    }
</script>
</body>
