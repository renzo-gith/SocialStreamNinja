@import url('https://fonts.googleapis.com/css2?family=Radley&display=swap');

body, html {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Radley', serif;

}

/* Lebar area chat = lebar Browser Source dikurangi margin 20px */
#chat-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow: visible;
}

@keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3) translateX(-80px) translateY(50px) rotate(20deg); }
    50% { opacity: 1; transform: scale(1.05); }
    70% { opacity: 1; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}

.fade-out {
    animation: fadeOut 0.6s ease-in forwards;
}
@keyframes fadeOut {
    to { opacity: 0; transform: translateY(-50px); }
}

/* Kotak dalam: garis 1px (bisa gradasi) */
.message {
    box-sizing: border-box;
    padding: 8px 42px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--inner) padding-box, var(--line) border-box;
    color: var(--text);
    font-size: 18px;
    line-height: 1.3;
    text-align: left;
    overflow-wrap: anywhere;
}

/* Lelehan di kiri atas */
.chat-message::before {
    content: '';
    position: absolute;
    left: -2px;
    top: -2px;
    width: 51px;
    height: 24px;
    background: var(--drip) no-repeat 0 0 / contain;
    z-index: 2;
    pointer-events: none;
}

    padding: 2px 8px;
    border-radius: 4px;
    background: var(--tag);
    box-shadow: 0 0 0 0.5px var(--tag-line);
    color: var(--tag-text);
    font-size: 10px;
    line-height: 13px;
    white-space: nowrap;
}

/* Emote */

    width: 1.35em !important;
    height: 1.35em !important;

.message img.content-img,

    height: auto !important;

<body>
<div id="chat-container">
    <div id="message-list-wrapper">
		<div id="spacer" style="height: 2200px; width: 100%;"></div>
    </div>
</div>
<script>
    // ===================================================================
    // == BAGIAN 1: PENGATURAN
    // ===================================================================

    // EDIT NAMA PENGGUNA STREAMER DI SINI (huruf besar/kecil dan "@" diabaikan)
    const STREAMER_USERNAME = ["El Pirstinn", "VierstinRovve"];

    const chatContainer = document.getElementById('chat-container');
    const urlParams = new URLSearchParams(window.location.search);
    const MAX_MESSAGES = Math.max(1, parseInt(urlParams.get("limit"), 10) || 8);
    const AUTO_HIDE = Math.max(0, parseInt(urlParams.get("autohide"), 10) || 0); // &autohide=30 = pesan hilang setelah 30 detik

    const lower = s => String(s == null ? "" : s).toLowerCase();
    const normName = s => lower(s).trim().replace(/^@+/, "");
    const STREAMERS = STREAMER_USERNAME.map(normName);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    function safeUrl(u) {
        u = String(u || "").trim();
        return /^(https?:)?\/\//i.test(u) || /^data:image\//i.test(u) ? u : "";
    }
    function contentMediaHTML(url) {
        url = safeUrl(url);
        if (!url) return "";
        if (/\.(mp4|webm)(\?|#|$)/i.test(url)) {
            return `<video class="content-img" src="${esc(url)}" autoplay muted loop playsinline></video>`;
        }
        return `<img class="content-img" src="${esc(url)}" alt="" onerror="this.remove()">`;
    }

    // === QUEUE SYSTEM (Sistem Antrian Pesan) ===
    const messageQueue = [];
    let isProcessing = false;

    function processQueue() {
        if (isProcessing || messageQueue.length === 0) return;
        isProcessing = true;
        addChatMessage(messageQueue.shift());
        setTimeout(() => {
            isProcessing = false;
            processQueue();
        }, 600); // Jeda 600ms antar pesan agar tidak spam
    }

    function enqueueMessage(item) {
        messageQueue.push(item);
        if (!isProcessing) processQueue();
    }

    // === FUNGSI ANIMASI ===
    function animateChatShift(newEl) {
        const messages = Array.from(chatContainer.children);
        const firstRects = messages.map(el => el.getBoundingClientRect());

        chatContainer.appendChild(newEl);

        const lastRects = messages.map(el => el.getBoundingClientRect());

        messages.forEach((el, i) => {
            const deltaY = firstRects[i]?.top - lastRects[i]?.top;
            if (deltaY) {
                requestAnimationFrame(() => {
                    el.style.transform = `translateY(${deltaY}px)`;
                    el.style.transition = 'transform 0s';
                });
            }
        });

        requestAnimationFrame(() => {
            messages.forEach(el => {
                el.style.transform = '';
                el.style.transition = 'transform 0.4s ease-out';
            });
        });
    }

    // === HAPUS PESAN ===
    function removeEl(el) {
        if (!el || el.classList.contains('fade-out')) return;
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 600);
    }
    // Pesan yang masih tampil (tidak termasuk spacer dan pesan yang sedang menghilang)
    function activeMessages() {
        return Array.from(chatContainer.querySelectorAll('.chat-message:not(.fade-out)'));
    }
    function enforceLimit() {
        const list = activeMessages();
        for (let i = 0; i < list.length - MAX_MESSAGES; i++) removeEl(list[i]);
    }

    // Pesan dihapus moderator
    function handleDelete(del) {
        if (!del) return;
        activeMessages().forEach(el => {
            let hit = false;
            if (del.id != null && el.dataset.mid === String(del.id)) hit = true;
            else if (del.meta && del.meta.messageId && el.dataset.nativeId === String(del.meta.messageId)) hit = true;
            else if (del.id == null && !(del.meta && del.meta.messageId)) {
                if (del.userid && el.dataset.userid === lower(del.userid)) hit = true;
                else if (del.chatname && el.dataset.name === lower(del.chatname)) hit = true;
            }
            if (hit) removeEl(el);
        });
    }
    // Pengguna di-ban: hapus semua pesannya
    function removeUser(data) {
        const uid = lower(data.userid), name = lower(data.chatname);
        activeMessages().forEach(el => {
            if ((uid && el.dataset.userid === uid) || (name && el.dataset.name === name)) removeEl(el);
        });
    }

    // === FUNGSI PEMBUAT TAMPILAN PESAN (HTML Builder) ===
    function addChatMessage(item) {
        const chatEl = document.createElement('div');
        chatEl.className = `chat-message ${item.role}`;
        chatEl.dataset.name = lower(item.username);
        if (item.userid) chatEl.dataset.userid = lower(item.userid);
        if (item.id != null) chatEl.dataset.mid = String(item.id);
        if (item.nativeId) chatEl.dataset.nativeId = String(item.nativeId);

        chatEl.innerHTML = `
            <div class="badge"><span class="name">${esc(item.username)}</span></div>
            <div class="message">${item.messageHTML}${contentMediaHTML(item.contentimg)}</div>
        `;

        animateChatShift(chatEl);
        enforceLimit();

        if (AUTO_HIDE > 0) {
            setTimeout(() => removeEl(chatEl), AUTO_HIDE * 1000);
        }
    }

    // ===================================================================
    // == BAGIAN 2: "JEMBATAN" PENGHUBUNG SSN KE SISTEM ANDA
    // ===================================================================

    function addMessageToOverlay(data) {
        if (!data || typeof data !== 'object') return;

        if (data.delete) { handleDelete(data.delete); return; }
        if (data.event === 'user_banned') { removeUser(data); return; }

        // Hanya pesan chat biasa: semua event (join, like, follow, gift, share, dll.) diabaikan
        if (data.event) return;

        const username = data.chatname || data.username || '';
        // Pesan teks dari SSN berupa HTML (emote = <img>). Kalau &textonly, escape.
        const messageHTML = data.textonly ? esc(data.chatmessage || '') : (data.chatmessage || '');

        // Abaikan jika tidak ada isi pesan maupun stiker
        if (!String(messageHTML).trim() && !data.contentimg) return;

        // Tentukan peran
        let roleClass = 'regular';

        if (STREAMERS.includes(normName(data.chatname)) || (data.username && STREAMERS.includes(normName(data.username)))) {
            roleClass = 'owner';
        } else {
            const badgeSrcs = (data.chatbadges || []).map(badge => {
                if (typeof badge === 'string') return badge.toLowerCase();
                if (badge && typeof badge === 'object' && typeof badge.src === 'string') return badge.src.toLowerCase();
                return '';
            }).filter(Boolean);

            if (badgeSrcs.some(src => src.includes('broadcaster') || src.includes('owner'))) {
                roleClass = 'owner';
            } else if (data.mod === true || badgeSrcs.some(src => src.includes('moderator') || src.includes('moderater'))) {
                roleClass = 'moderator';
            } else if (
                data.membership === "MEMBERSHIP" ||
                badgeSrcs.some(src =>
                    src.includes('gifter') ||
                    src.includes('subscriber') ||
                    src.includes('member') ||
                    (src.includes('fans_badge') && !src.includes('grey'))
                )
            ) {
                roleClass = 'member';
            }
        }

        const meta = data.meta || {};
        enqueueMessage({
            username, messageHTML, role: roleClass, contentimg: data.contentimg,
            userid: data.userid, id: data.id, nativeId: meta.messageId
        });
    }

    // ===================================================================
    // == BAGIAN 3: KODE SSN UNTUK MENERIMA DATA
    // == Tanpa ?session= di URL, widget tidak tersambung ke mana pun.
    // ===================================================================
    const roomID = (urlParams.get("session") || "").trim();
    var password = "false";
    var featuredMode = false;

    if (roomID) {
        var iframe = document.createElement("iframe");
        if (featuredMode) {
            iframe.src = `https://vdo.socialstream.ninja/?ln&password=${password}&salt=vdo.ninja&label=overlay&exclude=${encodeURIComponent(roomID)}&scene&novideo&noaudio&cleanoutput&room=${encodeURIComponent(roomID)}`;
        } else {
            iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=" + password + "&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=" + encodeURIComponent(roomID);
        }
        iframe.style.cssText = "width:0;height:0;border:0;position:absolute;top:-10px;left:-10px;";
        document.body.appendChild(iframe);
        window.addEventListener("message", function(e) {
            if (e.source != iframe.contentWindow) return;
            if (e.data && e.data.dataReceived && e.data.dataReceived.overlayNinja) {
                addMessageToOverlay(e.data.dataReceived.overlayNinja);
            }
        });
    }

    var conCon = 1;
    var socketserver = false;
    var serverURL = urlParams.has("localserver") ? "ws://127.0.0.1:3000" : "wss://io.socialstream.ninja";

    function setupSocket() {
        socketserver.onclose = function() {
            setTimeout(function() {
                conCon += 1;
                socketserver = new WebSocket(serverURL);
                setupSocket();
            }, 100 * conCon);
        };
        socketserver.onopen = function() {
            conCon = 1;
            socketserver.send(JSON.stringify({ "join": roomID, "out": 3, "in": 4 }));
        };
        socketserver.addEventListener('message', function(event) {
            if (event.data) {
                try {
                    var data = JSON.parse(event.data);
                    if (data) addMessageToOverlay(data);
                } catch (error) {
                    console.error("Error processing WebSocket message:", error);
                }
            }
        });
    }

    if (roomID && (urlParams.has("server") || urlParams.has("server2"))) {
        serverURL = urlParams.get("server") || urlParams.get("server2") || serverURL;
        socketserver = new WebSocket(serverURL);
        setupSocket();
    }
</script>
