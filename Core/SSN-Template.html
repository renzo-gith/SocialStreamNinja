<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Chat Overlay</title>
    <!--
        TEMPLATE WIDGET BARU
        1. Salin file ini ke folder baru: NamaWidget/SSN-NamaWidget.html (aset gambar di NamaWidget/Asset/).
        2. Ganti CSS di bawah sesuai desain. Logika chat tidak perlu disentuh: semuanya di Core/renzo-chat-core.js.
        3. Struktur HTML tiap pesan yang dibuat Core:
             <div class="chat-message ROLE [event event-xxx] [vip] [first-time]">
               <div class="badge"><span class="truncate-text">Nama / nominal / New Member</span></div>
               <div class="message">Isi pesan … [<img class="content-img">]</div>
             </div>
           ROLE = regular | member | moderator | owner | donation | new-subscriber | gifted-membership
           Donasi & member baru berisi <span class="alert-subtitle"> dan <span class="alert-text"> di dalam .message.
        4. Ukuran: pakai calc(Npx * var(--k)) supaya &scale= di URL bekerja.
    -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap');

        :root {
            --k: 1;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        #chat-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: calc(16px * var(--k));
        }

        .chat-message {
            opacity: 0;
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;

            /* Warna default (Regular) */
            --fill: #FFFFFF;
            --text: #282828;
            --tag: #FFD342;
            --tag-text: #FFFFFF;
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: none; }
        }

        .fade-out {
            animation: fadeOut 0.6s ease-in forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-50px); }
        }

        .badge {
            position: relative;
            z-index: 2;
            margin-left: calc(16px * var(--k));
            margin-bottom: calc(-12px * var(--k));
            padding: calc(3px * var(--k)) calc(14px * var(--k));
            background: var(--tag);
            color: var(--tag-text);
            border-radius: calc(8px * var(--k));
            font-size: calc(14px * var(--k));
            font-weight: 700;
            white-space: nowrap;
        }

        .truncate-text {
            display: inline-block;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: bottom;
        }

        .message {
            position: relative;
            box-sizing: border-box;
            max-width: 100%;
            padding: calc(14px * var(--k)) calc(20px * var(--k));
            background: var(--fill);
            color: var(--text);
            border-radius: calc(14px * var(--k));
            font-size: calc(18px * var(--k));
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .message img,
        .message svg {
            width: 1.3em;
            height: 1.3em;
            vertical-align: middle;
        }

        .alert-subtitle {
            display: block;
            font-size: 0.75em;
            opacity: 0.8;
        }

        /* Warna per peran */
        .chat-message.member,
        .chat-message.gifted-membership,
        .chat-message.new-subscriber { --tag: #FFAE00; }
        .chat-message.moderator { --tag: #73A340; }
        .chat-message.owner,
        .chat-message.donation { --tag: #FF6A6A; }
    </style>
</head>

<body>
    <div id="chat-container">
        <div id="message-list-wrapper">
            <div id="spacer" style="height: 2200px; width: 100%;"></div>
        </div>
    </div>
    <script>
        window.RENZO_WIDGET = {
            streamers: [],                          // Nama akun streamer (Owner), contoh: ["NamaStreamer"]
            platforms: ["youtube", "tiktok", "twitch"],
            showMemberBadge: false
        };
    </script>
    <script src="../Core/renzo-chat-core.js"></script>
</body>

</html>
