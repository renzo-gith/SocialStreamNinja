<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Chat Overlay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
    <!-- Links to Social Stream Ninja resources -->
    <link rel="canonical" href="https://socialstream.ninja/">
    <meta name="generator" content="Social Stream Ninja - https://github.com/steveseguin/social_stream">
    <style>
        /* -- PASTEL CHAT: CHAT WIDGET UNTUK SOCIAL STREAM NINJA -- */
        /* Ukuran mengikuti desain Figma (frame "Pastel Chat") dikali --k.
           Tambahkan &scale=1.2 dst. di URL untuk memperbesar (default 1). */

        /* 1. Impor Font dan Pengaturan Dasar */
        /* =================================== */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Fredoka:wght@500;600&display=swap');

        :root {
            --k: 1;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* 2. Wadah Utama Pesan */
        /* =================================== */
        #chat-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            width: auto;
            display: flex;
            flex-direction: column;
            gap: calc(20px * var(--k));
            overflow: visible;
        }

        /* 3. Animasi Pesan */
        /* =================================== */
        .chat-message {
            opacity: 0;
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            align-self: stretch;
            width: 100%;
            box-sizing: border-box;
            padding: 2px;

            /* Warna default (Regular) */
            --fill: #FDF5E0;
            --line: #63423C;
            --ring: #FDF5E0;
            --text: #DAB879;
            --tag: #DAB879;
            --tag-text: #FDF5E0;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .fade-out {
            animation: fadeOut 0.6s ease-in forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-50px);
            }
        }

        /* 4. Tag Nama (username) */
        /* =================================== */
        .badge {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            max-width: calc(100% - (37.84px * var(--k)) - 8px);
            box-sizing: border-box;
            margin-left: calc(37.84px * var(--k));
            margin-bottom: calc(-17px * var(--k));
            padding: calc(4px * var(--k)) calc(18px * var(--k));
            background: var(--tag);
            border: calc(2px * var(--k)) solid var(--line);
            border-radius: calc(12px * var(--k));
            box-shadow: 0 0 0 calc(2px * var(--k)) var(--ring);
            color: var(--tag-text);
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            font-size: calc(12px * var(--k));
            font-weight: 500;
            line-height: 1.2;
            white-space: nowrap;
        }

        .truncate-text {
            display: inline-block;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: bottom;
        }

        /* 5. Gelembung Pesan */
        /* =================================== */
        .message {
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            max-width: calc(100% - 4px);
            padding: calc(16px * var(--k)) calc(32px * var(--k));
            background: var(--fill);
            border: calc(2px * var(--k)) solid var(--line);
            border-radius: calc(32px * var(--k));
            box-shadow: 0 0 0 calc(2px * var(--k)) var(--ring);
            color: var(--text);
            font-size: calc(18px * var(--k));
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* Emoji & stiker */
        .message img,
        .message svg {
            width: 1.3em;
            height: 1.3em;
            vertical-align: middle;
            display: inline-block;
            margin: 0 2px;
        }

        /* 6. Warna per Peran */
        /* =================================== */
        /* Moderator: hijau */
        .chat-message.moderator {
            --fill: #D0DF5E;
            --line: #3E5C1E;
            --ring: #D0DF5E;
            --text: #73A340;
            --tag: #73A340;
            --tag-text: #D0DF5E;
        }

        /* Owner: biru toska (juga dipakai untuk donasi) */
        .chat-message.owner,
        .chat-message.donation {
            --fill: #84D3DA;
            --line: #285460;
            --ring: #84D3DA;
            --text: #609BAB;
            --tag: #609BAB;
            --tag-text: #84D3DA;
        }

        /* Member / Subscriber: pink salem (juga dipakai untuk member baru) */
        .chat-message.member,
        .chat-message.gifted-membership,
        .chat-message.new-subscriber {
            --fill: #FFC5B7;
            --line: #F27771;
            --ring: #FFC5B7;
            --text: #FE847E;
            --tag: #FE847E;
            --tag-text: #FFC5B7;
        }

        /* 7. Alert (Super Chat / Donasi & Member Baru) */
        /* =================================== */
        .alert-subtitle {
            display: block;
            font-size: 0.75em;
            font-weight: 600;
            opacity: 0.85;
        }

        .alert-subtitle + .alert-text {
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <div id="chat-container">
        <div id="message-list-wrapper">
            <div id="spacer" style="height: 2200px; width: 100%;"></div>
        </div>
    </div>
    <script>
        // ===================================================================
        // == PENGATURAN WIDGET
        // == Logika chat ada di Core/renzo-chat-core.js (dipakai bersama semua widget baru).
        // == Parameter URL: ?session=KODE (atau ?demo=1 untuk chat contoh) &limit=8 &autohide=30 &scale=1 &owner=NamaStreamer
        // ==                &onlytype=youtube,twitch &hidetype=tiktok &showevents=raid &mindono=1
        // ===================================================================
        window.RENZO_WIDGET = {
            streamers: [],                          // Nama akun streamer (Owner), contoh: ["NamaStreamer"]
            platforms: ["youtube", "tiktok", "twitch"],
            showMemberBadge: false                  // true = tampilkan ikon badge member YouTube di pesan
        };
    </script>
    <script src="../Core/renzo-chat-core.js"></script>
</body>

</html>
